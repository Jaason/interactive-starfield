<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Starfield quick start</title>
  <style>
    body { margin: 0; background: #080b10; color: white; font: 16px system-ui; }
    .hero { position: relative; height: 400px; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
    h1 { position: relative; margin: 0; padding: 2rem; }
  </style>
</head>
<body>
  <section class="hero">
    <canvas id="starfield" aria-hidden="true"></canvas>
    <h1>Your content stays in HTML.</h1>
  </section>
  <script type="module">
    import { Starfield } from '../../src/index.js';

    const options = {
      preset: 'deep-space',
      stars: { count: 140 },
      rendering: { maxDpr: 2 },
    };
    let field = new Starfield('#starfield', options);

    // Destroy before removal and release the host's reference too.
    window.addEventListener('pagehide', () => { field.destroy(); field = null; });
    window.addEventListener('pageshow', event => {
      if (event.persisted) field = new Starfield('#starfield', options);
    });
  </script>
</body>
</html>
